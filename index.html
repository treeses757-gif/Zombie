<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zombie Game</title>
  <link rel="stylesheet" href="./css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js"
      }
    }
  </script>
</head>
<body>

  <div id="menu-screen" class="screen">
    <h1>🧟 Zombie Game</h1>
    <div class="menu-box">
      <label>Ваше имя:
        <input id="player-name" type="text" maxlength="16" placeholder="Игрок" />
      </label>
      <button id="create-room-btn">Создать комнату</button>
      <div class="divider">или</div>
      <label>ID комнаты:
        <input id="join-room-id" type="text" maxlength="8" placeholder="ABC123" />
      </label>
      <button id="join-room-btn">Присоединиться</button>
    </div>
  </div>

  <div id="lobby-screen" class="screen" style="display:none">
    <h2>Лобби</h2>
    <p>ID комнаты: <span id="lobby-room-id">—</span></p>
    <ul id="lobby-players"></ul>
    <p id="lobby-status"></p>
    <button id="start-btn" disabled>Старт (только хост)</button>
  </div>

  <div id="upgrade-screen" class="screen" style="display:none">
    <h2>Улучшение персонажа</h2>
    <p>Ваша роль: <b id="upgrade-role">—</b></p>
    <p>Стартовые улучшения на этот раунд:</p>
    <div id="upgrade-list"></div>
    <textarea id="upgrade-input" rows="3" style="display:none"></textarea>
    <button id="upgrade-submit">Подтвердить</button>
    <p id="upgrade-message"></p>
    <p id="upgrade-progress"></p>
  </div>

  <div id="game-screen" class="screen" style="display:none">
    <div id="game-status"></div>
    <canvas id="gameCanvas" width="800" height="600" tabindex="0" style="display:block;width:100vw;height:100vh"></canvas>
  </div>

  <div id="end-screen" class="screen" style="display:none">
    <h2 id="end-title">Игра окончена</h2>
    <button onclick="location.reload()">Играть снова</button>
  </div>

  <!-- cache-bust: ?v=2 заставляет Chrome скачать свежий main.js -->
  <script type="module" src="./js/main.js?v=2"></script>
</body>
</html>
